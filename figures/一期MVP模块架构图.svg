  <rect x="12" y="218" width="656" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="234" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">假设验证: <tspan font-weight="500" fill="#0F6E56">H1</tspan> CCC=0.873 · <tspan font-weight="500" fill="#0F6E56">H2</tspan> 规则引擎跑通 · <tspan font-weight="500" fill="#534AB7">H3</tspan> 待真实数据 · <tspan font-weight="500" fill="#0F6E56">H4</tspan> Gradio完成 · <tspan font-weight="500" fill="#0F6E56">H5</tspan> 降噪实测</text>
  <text x="340" y="250" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">step3特征级基线: XGBoost树模型对尺度不敏感 → 保留代码待多说话人数据后重新评估</text>

  <rect x="12" y="275" width="656" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
